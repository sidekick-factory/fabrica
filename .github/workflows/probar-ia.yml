name: Probar IA

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "opencv-python-headless<5" numpy
      - name: Probar el juez con Claude (igual que en la fabrica)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_ORDER: claude
        run: |
          mkdir -p work
          python3 - <<'PY'
          import sys, json, cv2, numpy as np
          sys.argv = ["x", "site"]
          sys.path.insert(0, "factory")
          import make_clips as m
          vw = cv2.VideoWriter("work/t.mp4", cv2.VideoWriter_fourcc(*"mp4v"), 10, (640, 360))
          for i in range(120):
              f = np.zeros((360, 640, 3), np.uint8); f[:] = (30, 120 + i, 200)
              cv2.putText(f, "GTA 6 car crash %d" % i, (40, 180), cv2.FONT_HERSHEY_SIMPLEX, 1.2, (255, 255, 255), 3)
              vw.write(f)
          vw.release()
          words = [{"start": i * 0.5, "end": i * 0.5 + 0.4, "word": w} for i, w in enumerate(
              "bro what is he doing no no no he just crashed the car into the police station lmao".split())]
          out = m.ai_judge("work/t.mp4", {"name": "Kai Cenat", "login": "kaicenat"}, {"title": "kai crashes car"}, words)
          print("RESULTADO:", json.dumps(out, ensure_ascii=False))
          print("TRADUCCION:", m.translate_batch(["bro what is he doing", "he just crashed the car"], "en", "es"))
          PY
