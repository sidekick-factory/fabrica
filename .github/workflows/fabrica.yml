name: Fabrica diaria

on:
  schedule:
    - cron: "31 12 * * *"   # 8:31 en Bolivia
  workflow_dispatch:
    inputs:
      range:
        description: "Periodo de clips (24hr, 7d, 30d)"
        default: "24hr"
      fresh:
        description: "Rehacer los clips de hoy (si/no)"
        default: "no"

permissions:
  contents: write
  issues: write
  actions: write

concurrency: fabrica

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Traer la galeria actual
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site || mkdir -p site
          rm -rf site/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core tesseract-ocr
          pip install -q -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Fabricar clips
        env:
          RANGE: ${{ github.event.inputs.range || '24hr' }}
          FRESH: ${{ github.event.inputs.fresh || 'no' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python factory/make_clips.py site

      - name: Publicar galeria
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

      - name: Crear la lista de aprobacion del dia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 20
          gh label create aprobacion --color 9B28F0 --force
          if [ "$(cat new_count)" != "0" ]; then
            gh issue create --title "Aprobar clips $(date -u +'%F %H:%M') UTC" --body-file issue.md --label aprobacion
          fi

      - name: Reintentar subidas que quedaron pendientes por el tope diario
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label aprobacion --state open --json number,body --jq '.[] | select(.body | test("⏳|exceeded")) | .number'); do
            gh workflow run subir.yml -f issue=$n
          done
