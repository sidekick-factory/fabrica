name: Revisar lista con IA

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Numero de la lista de aprobacion"
        required: true

permissions:
  issues: write
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "opencv-python-headless<5" numpy google-genai
      - name: Revisar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python factory/revisar.py
