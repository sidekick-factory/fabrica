name: TikTok por Buffer

on:
  schedule:
    - cron: "17 */3 * * *"
  issues:
    types: [edited]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  tiktok:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'aprobacion')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rellenar la cola de TikTok
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python factory/tiktok_buffer.py
